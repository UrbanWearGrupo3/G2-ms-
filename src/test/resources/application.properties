spring.application.name=tienda-ropa

# Usar base de datos H2 en memoria para los tests
spring.datasource.url=jdbc:h2:mem:tiendadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# H2 Console y JPA para testing
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Claves fijas y seguras para los tests (evita fallos por falta de env en test)
security.jwt.secret-key=NDA0RTYzNTI2NjU1NkE1ODZOMzI3MjM1NzUzODd4MkY0MTNGNDQyODQ3MkI0QjYyNTA2NDUzNjc1NjZCNTk3MA==
security.jwt.expiration-time=86400000
security.admin-passcode=URBANWEAR-SECRET-ADMIN-2026

# Supabase dummy settings para test
supabase.url=https://dummy-project.supabase.co
supabase.service-role-key=dummy-service-role-key-for-test-purposes
supabase.bucket-name=productos

# Mercado Pago urls para test
mercadopago.access-token=dummy-access-token
mercadopago.back-urls.success=http://localhost:8080/api/pedidos/pago/success
mercadopago.back-urls.pending=http://localhost:8080/api/pedidos/pago/pending
mercadopago.back-urls.failure=http://localhost:8080/api/pedidos/pago/failure

# Spring Mail local dummy para test
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@ejemplo.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Token interno y notificaciones de test
security.internal-token=urbanwear-secret-token-2026
notification.admin-email=admin@urbanwear.com
