spring.application.name=tienda-ropa
# Datasource configuration (Supabase / PostgreSQL with H2 fallback)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (enabled by default, but can be disabled via H2_CONSOLE_ENABLED)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT and Security Settings
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME}
security.admin-passcode=${ADMIN_PASSCODE}

# Supabase Storage Properties
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.bucket-name=${SUPABASE_BUCKET_NAME}

# Mercado Pago configuration
mercadopago.back-urls.success=${MERCADOPAGO_SUCCESS_URL}
mercadopago.back-urls.pending=${MERCADOPAGO_PENDING_URL}
mercadopago.back-urls.failure=${MERCADOPAGO_FAILURE_URL}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security token for internal endpoints and notification setup
security.internal-token=${INTERNAL_TOKEN}
notification.admin-email=${ADMIN_EMAIL}

