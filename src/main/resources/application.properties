spring.application.name=tienda-ropa
# Datasource configuration (Supabase / PostgreSQL with H2 fallback)
spring.datasource.url=${DB_URL:jdbc:h2:mem:tiendadb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (enabled by default, but can be disabled via H2_CONSOLE_ENABLED)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT and Security Settings
security.jwt.secret-key=${JWT_SECRET_KEY:NDA0RTYzNTI2NjU1NkE1ODZOMzI3MjM1NzUzODd4MkY0MTNGNDQyODQ3MkI0QjYyNTA2NDUzNjc1NjZCNTk3MA==}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}
security.admin-passcode=${ADMIN_PASSCODE:URBANWEAR-SECRET-ADMIN-2026}

# Supabase Storage Properties
supabase.url=${SUPABASE_URL:https://rujrnngxhrouaqjeurkp.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:productos}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security token for internal endpoints and notification setup
security.internal-token=${INTERNAL_TOKEN:urbanwear-secret-token-2026}
notification.admin-email=${ADMIN_EMAIL:admin@urbanwear.com}


