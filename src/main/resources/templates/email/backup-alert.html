<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alerta de Fallo en Backup</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fce8e6; padding: 20px; margin: 0;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; border-top: 5px solid #d93025; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2 style="color: #c5221f; margin-top: 0;">⚠️ Alerta crítica de Backup</h2>
        <p style="color: #3c4043; font-size: 16px; line-height: 1.5;">
            El script automatizado de copia de seguridad externa de la base de datos de <strong>UrbanWear</strong> ha fallado.
        </p>
        
        <div style="background-color: #f8f9fa; border-left: 4px solid #d93025; padding: 15px; margin: 20px 0; border-radius: 4px;">
            <p style="margin: 0 0 10px 0; font-family: monospace; font-size: 14px; color: #202124;">
                <strong>Detalles del error:</strong>
            </p>
            <p style="margin: 0; font-family: monospace; font-size: 14px; color: #c5221f;" th:text="${error}">
                Error desconocido.
            </p>
        </div>
        
        <p style="color: #5f6368; font-size: 14px;">
            <strong>Fecha/Hora del fallo:</strong> <span th:text="${timestamp}">2026-06-19T00:00:00</span>
        </p>
        
        <hr style="border: 0; border-top: 1px solid #dadce0; margin: 30px 0;">
        
        <p style="color: #70757a; font-size: 12px; text-align: center; margin: 0;">
            Este es un correo automático del sistema de monitoreo de UrbanWear.
        </p>
    </div>
</body>
</html>
